name: The Streamic — Static Build

# ─────────────────────────────────────────────────────────────────────────────
# Simple hand-authored pipeline. No RSS, no AI generation, no external APIs.
# Triggers when articles, images, JSON manifest, CSS, or this workflow change.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'data/manual_articles.json'
      - 'docs/articles/**'
      - 'docs/assets/**'
      - 'scripts/build_static.py'
      - 'style.css'
      - 'homepage-layout.css'
      - 'main.js'
      - '.github/workflows/build-static.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE_BASE_URL: "https://www.thestreamic.in"

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build static site
        run: python3 scripts/build_static.py

      - name: Commit built files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/featured.html \
                  docs/ai-post-production.html \
                  docs/post-production-workflows.html \
                  docs/howto.html \
                  docs/insights.html \
                  docs/editorsdesk.html \
                  docs/sitemap.xml \
                  docs/robots.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate site [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
