name: Build site from hand-authored articles

on:
  # Run on every push that touches articles, images, build code, or the workflow itself
  push:
    branches: [main]
    paths:
      - 'docs/articles/**'
      - 'docs/assets/**'
      - 'scripts/**'
      - 'style.css'
      - 'docs/style.css'
      - 'docs/homepage-layout.css'
      - '.github/workflows/build.yml'
  # Also allow "Run workflow" from the Actions tab
  workflow_dispatch:

permissions:
  contents: write   # scanner + build commit regenerated files back to main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan hand-authored articles → regenerate JSON index
        run: python scripts/scan_articles.py

      - name: Build static site
        run: python scripts/build.py

      - name: Commit regenerated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated_articles.json docs/ || true
          # Only commit if something actually changed
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate site [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
