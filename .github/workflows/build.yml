name: Streamic Manual Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE_BASE_URL: "https://www.thestreamic.in"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install feedparser beautifulsoup4 python-slugify requests

      - name: Build site
        run: |
          python scripts/generate_editorial.py
          python scripts/generate_vendor_hub.py || true
          python scripts/build.py
          test -f docs/index.html
          test -f docs/featured.html
          test -f docs/sitemap.xml

      - name: Commit
        run: |
          git config user.name "Streamic Bot"
          git config user.email "technodate3@gmail.com"
          git add -A docs/ data/ .github/workflows/
          git diff --cached --quiet || (git commit -m "build: manual refresh [skip ci]" && git fetch origin main && (git merge origin/main --no-edit -s recursive -X ours 2>/dev/null || git merge origin/main --no-edit || true) && git push origin main)
