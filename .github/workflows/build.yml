name: Streamic Auto Build

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      summaries_only:
        description: "Run Groq summary generation + build only"
        required: false
        default: "false"
        type: choice
        options: ["false","true"]

permissions:
  contents: write

env:
  SITE_BASE_URL: "https://www.thestreamic.in"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  build:
    name: Fetch + Generate + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install feedparser beautifulsoup4 python-slugify jinja2 requests

      - name: Fetch RSS feeds
        if: github.event.inputs.summaries_only != 'true'
        run: python scripts/fetch_rss.py

      - name: Generate RSS article cards
        if: github.event.inputs.summaries_only != 'true'
        run: python scripts/rewrite_feed.py

      - name: Generate editorial deep-dives
        if: github.event.inputs.summaries_only != 'true'
        run: python scripts/generate_editorial.py

      - name: Gemini AI analysis (primary — if key available)
        env:
          ENABLE_GEMINI_PREMIUM: "true"
          GEMINI_MAX_PER_RUN: "6"
        run: python ./scripts/generate_gemini.py || echo "Gemini step skipped"

      - name: Groq AI summaries (fallback — articles Gemini did not upgrade)
        env:
          GROQ_PREMIUM_ONLY: "true"
          MAX_PER_RUN: "8"
        run: python ./scripts/generate_summaries.py || echo "Groq step skipped"

      - name: OpenRouter reasoning models (tier-3 — free DeepSeek-R1 + fallbacks)
        env:
          OPENROUTER_MAX_PER_RUN: "5"
          OPENROUTER_TEMPERATURE: "0.1"
          OPENROUTER_TOP_P: "0.95"
          OPENROUTER_PRESENCE_PENALTY: "0.1"
        run: python ./scripts/generate_openrouter.py || echo "OpenRouter step skipped"

      - name: Assign taxonomy images (before build)
        run: python scripts/assign_images.py || echo "Image assigner skipped"

      - name: Build site
        run: python scripts/build.py

      - name: SEO audit + auto-fix canonicals
        env:
          ADSENSE_PUB_ID: "ca-pub-8033069131874524"
        run: python scripts/seo_audit.py || echo "SEO audit skipped"

      - name: Verify build
        run: |
          test -f docs/index.html     || exit 1
          test -f docs/featured.html  || exit 1
          test -f docs/sitemap.xml    || exit 1
          echo "Articles: $(find docs/articles -name '*.html' | wc -l)"
          echo "Pages:    $(find docs -maxdepth 1 -name '*.html' | wc -l)"

      - name: Commit
        run: |
          git config user.name  "Streamic Bot"
          git config user.email "technodate3@gmail.com"
          git add -A
          git diff --cached --quiet || (
            git commit -m "build: auto-refresh [skip ci]" &&
            git fetch origin main &&
            git rebase origin/main --strategy-option=ours 2>/dev/null ||
            git rebase --abort 2>/dev/null || true &&
            git push origin main --force-with-lease
          )
