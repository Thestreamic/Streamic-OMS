name: The Streamic — Quality RSS + Editorial Build

on:
  schedule:
    - cron: "10 8 * * *"
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
    - cron: "30 8 * * 6"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "What to run"
        required: false
        default: "rss_only"
        type: choice
        options:
          - "rss_only"
          - "build_only"
          - "vendor_hub"

permissions:
  contents: write

env:
  SITE_BASE_URL: "https://www.thestreamic.in"
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate-and-build:
    name: Generate Articles & Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: pip install feedparser beautifulsoup4 python-slugify requests

      - name: Set run mode
        id: mode
        run: |
          HOUR=$(date -u +%H)
          DOW=$(date -u +%u)
          INPUT="${{ github.event.inputs.run_mode }}"

          if [ -n "$INPUT" ]; then
            MODE="$INPUT"
          elif [ "$HOUR" = "08" ] && [ "$DOW" = "6" ]; then
            MODE="vendor_hub"
          else
            MODE="rss_only"
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "Mode: $MODE"

      - name: Fetch RSS feeds
        if: steps.mode.outputs.mode != 'build_only'
        run: python3 scripts/fetch_rss.py

      - name: Rewrite RSS to article cards
        if: steps.mode.outputs.mode != 'build_only'
        run: python3 scripts/rewrite_feed.py

      - name: Generate editorial articles
        run: python3 scripts/generate_editorial.py

      - name: Generate Professional Media Systems Guide
        if: steps.mode.outputs.mode == 'vendor_hub'
        env:
          VENDOR_HUB_MODE: weekly
        run: python3 scripts/generate_vendor_hub.py || echo "Vendor guide generation incomplete; existing guides preserved"

      - name: Build static site
        run: |
          python3 scripts/build.py
          test -f docs/index.html
          test -f docs/featured.html
          test -f docs/posts.html
          test -f docs/sitemap.xml

      - name: Commit generated content
        run: |
          git config user.name "Streamic Bot"
          git config user.email "technodate3@gmail.com"
          git add -A docs/ data/ .github/workflows/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "build: quality rss refresh [skip ci]"
            git fetch origin main
            git merge origin/main --no-edit -s recursive -X ours 2>/dev/null || git merge origin/main --no-edit || true
            git push origin main
          fi
