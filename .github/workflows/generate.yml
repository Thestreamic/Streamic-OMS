name: The Streamic — Full Content Pipeline

# ═══════════════════════════════════════════════════════════════
# PIPELINE ORDER:
#   1. Node.js: Fetch RSS → Groq API (llama3-70b) → Generate 1200+ word articles
#   2. Python:  Fetch RSS metadata → rewrite_feed → build.py
#   3. Commit everything to main
# ═══════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      skip_hf:
        description: "Skip Groq article generation (build only)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_rss:
        description: "Skip RSS fetch (build only)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

env:
  SITE_BASE_URL: "https://www.thestreamic.in"
  NODE_VERSION:  "20"
  PYTHON_VERSION: "3.11"

jobs:
  generate-and-build:
    name: Generate Articles & Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Set up Node.js ─────────────────────────────────────────────────
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── 3. Install Node dependencies ─────────────────────────────────────
      - name: Install Node.js dependencies
        run: npm install

      # ── 4. Set up Python ─────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ── 5. Install Python dependencies ───────────────────────────────────
      - name: Install Python dependencies
        run: pip install feedparser beautifulsoup4 python-slugify requests

      # ── 6. STAGE 1: Hugging Face article generation (Node.js) ────────────
      # Reads RSS feeds → calls HF Inference API → writes docs/posts/*.html
      - name: "Stage 1: Generate AI articles (Groq API)"
        if: github.event.inputs.skip_hf != 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SITE_BASE_URL: ${{ env.SITE_BASE_URL }}
        run: |
          echo "🤖 Calling Groq API (llama3-70b-8192)..."
          node scripts/generate.js
          echo "✓ Groq generation complete"
          echo "Posts generated: $(find docs/posts -name '*.html' 2>/dev/null | wc -l)"

      # ── 7. STAGE 2: RSS metadata fetch (Python) ───────────────────────────
      - name: "Stage 2: Fetch RSS feeds"
        if: github.event.inputs.skip_rss != 'true'
        run: |
          python3 scripts/fetch_rss.py
          echo "✓ RSS fetch complete"

      # ── 8. STAGE 3: Rewrite RSS → article cards ───────────────────────────
      - name: "Stage 3: Rewrite RSS feeds to article cards"
        if: github.event.inputs.skip_rss != 'true'
        run: |
          python3 scripts/rewrite_feed.py
          echo "✓ RSS rewrite complete"

      # ── 9. STAGE 4: Generate editorial deep-dives ─────────────────────────
      - name: "Stage 4: Generate editorial articles"
        run: python3 scripts/generate_editorial.py

      # ── 10. STAGE 5: Groq summaries (optional) ───────────────────────────
      - name: "Stage 5: Groq card summaries (if key available)"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/generate_summaries.py || echo "Groq step skipped"

      # ── 11. STAGE 6: Build full static site (Python) ─────────────────────
      - name: "Stage 6: Build static site"
        run: |
          python3 scripts/build.py
          echo "✓ Site build complete"
          echo "Pages:    $(find docs -maxdepth 1 -name '*.html' | wc -l)"
          echo "Articles: $(find docs/articles -name '*.html' 2>/dev/null | wc -l)"
          echo "Posts:    $(find docs/posts    -name '*.html' 2>/dev/null | wc -l)"

      # ── 12. Verify build ─────────────────────────────────────────────────
      - name: Verify build output
        run: |
          test -f docs/index.html       || (echo "❌ index.html missing"    && exit 1)
          test -f docs/featured.html    || (echo "❌ featured.html missing"  && exit 1)
          test -f docs/posts.html       || (echo "❌ posts.html missing"     && exit 1)
          test -f docs/sitemap.xml      || (echo "❌ sitemap.xml missing"    && exit 1)
          test -f docs/data/generated_articles.json || (echo "⚠ generated_articles.json missing" )
          echo "✅ All required files present"

      # ── 13. Commit everything ─────────────────────────────────────────────
      - name: Commit generated content
        run: |
          git config user.name  "Streamic Bot"
          git config user.email "technodate3@gmail.com"

          # Stage all generated output
          git add docs/
          git add data/
          git add posts.html 2>/dev/null || true
          git add sitemap.xml 2>/dev/null || true
          git add featured.html index.html 2>/dev/null || true
          git add *.html 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            POSTS=$(find docs/posts -name '*.html' 2>/dev/null | wc -l)
            git commit -m "build: auto-refresh — ${POSTS} AI articles [skip ci]"
            git pull --rebase origin main || true
            git push origin main
            echo "✅ Committed and pushed"
          fi
